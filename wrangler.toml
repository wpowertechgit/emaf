name = "emaf"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Optional: JavaScript rendering through Cloudflare Browser Rendering.
# Uncomment to enable the `render: true` option on the scrape tool.
# [browser]
# binding = "BROWSER"

# Optional: Workers AI, enables the embedding rerank stage of the research tool.
# The Workers Free plan includes 10,000 neurons per day; see README.md.
# [ai]
# binding = "AI"

# Optional: KV namespace that caches scrape results (see README.md).
# Create it with `npx wrangler kv namespace create CACHE` and paste the id here.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<namespace id>"

# Optional: Workers Rate Limiting for tool calls (see README.md). namespace_id is
# any integer unique within your account; no resource needs to be created.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
#
#   [ratelimits.simple]
#   limit = 60
#   period = 60

# Optional: OAuth 2.1 login for the MCP endpoint (see README.md). Requires the
# AUTH_PASSWORD secret too. Create the namespace with
# `npx wrangler kv namespace create OAUTH_KV` and paste the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "bfd9a7ec251540fcbacaa06f532804a9"

# Optional plain variables.
# [vars]
# OPENALEX_MAILTO = "you@example.com"
# RATE_LIMIT_PER_MINUTE = "60"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   MCP_SECRET        the secret path segment of the MCP URL (required unless OAuth is configured)
#   AUTH_PASSWORD     owner password for the OAuth consent page, 12+ characters (enables OAuth with OAUTH_KV)
#   BRAVE_API_KEY     optional, enables Brave Search for web search
#   GITHUB_TOKEN      optional, read-only token for prior_art (higher limits, code search)
#   OPENALEX_API_KEY  optional, raises the OpenAlex daily budget for research
