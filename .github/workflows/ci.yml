name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Style check (no emoji, no em dashes)
        run: python3 scripts/emoji-gestapo.py .

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Emoji check
        run: python scripts/emoji-gestapo.py .

      - name: Build (wrangler deploy --dry-run)
        run: npx wrangler deploy --dry-run --outdir dist

